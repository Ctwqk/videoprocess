server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Routes that only the internal Python AutoFlow service implements; the Go
    # API serves the rest of /api/. The variable defers DNS to request time so
    # the frontend still starts while that service is down.
    location ~ ^/api/v1/((autoflow|channel-agent|llm|material-libraries|material-search)(/|$)|templates/[^/]+/execute(/batch)?$) {
        set $autoflow_api http://vp-autoflow-api-swarm:8080;
        proxy_pass $autoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2G;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://vp-api-swarm:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2G;
    }

    location /youtube/ {
        rewrite ^/youtube/(.*)$ /$1 break;
        proxy_pass http://10.0.0.150:18999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /platforms/api/platforms/xiaohongshu/ {
        proxy_pass http://10.0.0.150:8897/api/platforms/xiaohongshu/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /platforms/ {
        proxy_pass http://10.0.0.150:8898/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://vp-api-swarm:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
